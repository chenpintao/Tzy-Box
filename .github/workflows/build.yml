name: Build Executables

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  # ============ Node 本地服务（先混淆，再 pkg 打成单文件） ============
  build-node:
    name: Node 单文件（混淆）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: node20-win-x64
            bin: tzy-box-server.exe
            asset_name: tzy-box-windows-x64.exe
          - os: macos-latest
            target: node20-macos-arm64
            bin: tzy-box-server
            asset_name: tzy-box-macos-arm64
          - os: macos-13
            target: node20-macos-x64
            bin: tzy-box-server
            asset_name: tzy-box-macos-x64
          - os: ubuntu-latest
            target: node20-linux-x64
            bin: tzy-box-server
            asset_name: tzy-box-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成混淆源码（含浏览器端敏感 JS 与服务端入口）
        run: |
          npm install --no-save javascript-obfuscator
          node build.js --node

      - name: 打包单文件（基于混淆后的入口）
        run: |
          npm install --global @yao-pkg/pkg
          pkg dist-build/node/local_server.js --targets ${{ matrix.target }} --output ${{ matrix.bin }} --compress GZip

      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.bin }}
          if-no-files-found: error

      - name: 附带发布到 Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bin }}

  # ============ Python 分享服务（先 PyArmor 混淆，再 PyInstaller 打包） ============
  build-python:
    name: Python 单文件（混淆）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: share-server-windows-x64.exe
            out: share_server.exe
          - os: macos-latest
            asset_name: share-server-macos-arm64
            out: share_server
          - os: macos-13
            asset_name: share-server-macos-x64
            out: share_server
          - os: ubuntu-latest
            asset_name: share-server-linux-x64
            out: share_server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_share.txt
          pip install nuitka

      - name: Nuitka 编译（机器码 + 压缩）
        run: python -m nuitka --onefile --standalone --include-module=flask --include-module=Crypto.Cipher.AES --include-module=Crypto.Util.Padding --remove-output --windows-console-mode=disable --output-filename=share_server share_server.py

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p artifacts
          cp "dist/share_server${{ matrix.out == 'share_server.exe' && '.exe' || '' }}" "artifacts/${{ matrix.out }}"

      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/${{ matrix.out }}
          if-no-files-found: error

      - name: 附带发布到 Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ matrix.out }}
